[package]
name = "meta-tui"
version = "0.1.0"
edition = "2021"
description = "Meta-TUI: 智能体编排工作台"

[dependencies]
anyhow = "1"
ansitok = "0.3"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
portable-pty = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-textarea-2 = "0.11"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "meta_tui"
path = "src/lib.rs"

[[bin]]
name = "meta-tui"
path = "src/main.rs"
